# /etc/nginx/conf.d/probiz.conf
server {
        listen 80 default_server;
        server_name 144.24.7.55 _;

        # Set the document root to your ProBiz websites directory
        root /home/opc/ProBiz/websites/main/public;
        index index.html index.htm;

        # Enable directory browsing for development
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Main location block
        location / {
                try_files $uri $uri/ = 404;
        }

        # Serve games from the games directory
        location /games/ {
                alias /home/opc/ProBiz/websites/games/;
                try_files $uri $uri/ = 404;
        }

        # Serve projects
        location /projects/ {
                alias /home/opc/ProBiz/websites/;
                autoindex on;
                try_files $uri $uri/ = 404;
        }

        location /docs/ {
                alias /home/opc/ProBiz/docs/;
                try_files $uri $uri/ = 404;
                autoindex on;
        }

        location /nodejs/ {
                alias /home/opc/ProBiz/nodejs/;
                try_files $uri $uri/ = 404;
                autoindex on;
        }

        location /utility/ {
                alias /home/opc/ProBiz/websites/utility/;
                try_files $uri $uri/ = 404;
                autoindex on;
        }

        # ========== EJ-EV project ==========
        location /EJ-EV/ {
                alias /home/opc/ProBiz/websites/EJ-EV/;
                try_files $uri $uri/ = 404;
                autoindex on;
        }

        location /EJ-EV/Scribble/ {
                alias /home/opc/ProBiz/websites/EJ-EV/Scribble/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }

        location /EJ-EV/AlphabetSearch/ {
                alias /home/opc/ProBiz/websites/EJ-EV/AlphabetSearch/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }

        location /EJ-EV/AnimalSoundsMatch/ {
                alias /home/opc/ProBiz/websites/EJ-EV/AnimalSoundsMatch/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }

        location /EJ-EV/Bubbles/ {
                alias /home/opc/ProBiz/websites/EJ-EV/Bubbles/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }

        location /EJ-EV/Maze/ {
                alias /home/opc/ProBiz/websites/EJ-EV/Maze/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }

        location /EJ-EV/Trace/ {
                alias /home/opc/ProBiz/websites/EJ-EV/Trace/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }

        location /EJ-EV/speakText/ {
                alias /home/opc/ProBiz/websites/EJ-EV/speakText/;
                try_files $uri $uri/ = 404;

                # Ensure query parameters are preserved
                location ~ \.html$ {
                        try_files $uri = 404;
                }
        }
        
        # ========== SunCalc Node.js Application ==========
location /SunCalcWeb/ {
    proxy_pass http://localhost:3001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Optional: Add CORS headers if needed
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
}

# Handle options requests for CORS
location /SunCalcWeb/api/ {
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 200;
    }
    
    proxy_pass http://localhost:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

        # Serve Node.js apps (if you set up reverse proxy later)
        location /api/ {
                # For future Node.js apps
                # proxy_pass http: //localhost:3000;
                alias /home/opc/ProBiz/nodejs/;
                autoindex on;
        }

        # Static assets
        location /shared/ {
                alias /home/opc/ProBiz/shared/;
                expires 1y;
                add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

        # Error and access logs
        error_log /var/log/nginx/probiz_error.log;
        access_log /var/log/nginx/probiz_access.log;
}